# Compila la APK del PORTAL DE EMPLEADOS T24 (carpeta portal-empleados) y la publica
# en Releases con la etiqueta fija "portal" (no toca la publicación de Stock).
# Usa la misma firma que Stock (secretos T24_KEYSTORE_B64 y T24_KEYSTORE_PASSWORD).

name: Compilar APK Portal

on:
  push:
    branches: [main]
    paths:
      - 'portal-empleados/**'
      - '.github/workflows/portal-empleados.yml'
      - '!**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compilar-apk-portal
  cancel-in-progress: false

jobs:
  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: portal-empleados
    steps:
      - name: Bajar el código
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-37" > /dev/null || echo "La plataforma la baja Gradle si hace falta"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Preparar firma
        env:
          B64: ${{ secrets.T24_KEYSTORE_B64 }}
        run: |
          if [ -z "$B64" ]; then echo "::error::Faltan los secretos de firma"; exit 1; fi
          echo "$B64" | base64 -d > "$RUNNER_TEMP/t24.jks"

      - name: Compilar APK firmada
        env:
          T24_KEYSTORE_PATH: ${{ runner.temp }}/t24.jks
          T24_KEYSTORE_PASSWORD: ${{ secrets.T24_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Preparar publicación
        run: |
          VC=$((GITHUB_RUN_NUMBER + 1))
          VN="1.${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/release/app-release.apk Portal-T24.apk
          printf '{"versionCode":%s,"versionName":"%s","apk":"https://github.com/%s/releases/download/portal/Portal-T24.apk"}\n' \
            "$VC" "$VN" "$GITHUB_REPOSITORY" > version.json
          cat version.json

      - name: Publicar en Releases (etiqueta "portal")
        uses: softprops/action-gh-release@v2
        with:
          tag_name: portal
          name: Portal de Empleados T24
          body: |
            Descargá **Portal-T24.apk** e instalala. Las apps ya instaladas avisan solas cuando hay una versión nueva.
          files: |
            portal-empleados/Portal-T24.apk
            portal-empleados/version.json
          make_latest: false
          overwrite_files: true

      - name: Borrar la clave del servidor
        if: always()
        run: rm -f "$RUNNER_TEMP/t24.jks"
